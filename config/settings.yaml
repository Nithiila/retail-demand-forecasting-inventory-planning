data:
  raw_dir: data/raw
  processed_dir: data/processed
  outputs_dir: outputs
  sales_file: sales.csv
  products_file: products.csv
  stores_file: stores.csv
  inventory_file: inventory.csv

random_seed: 42
forecast:
  horizon_weeks: 4
inventory:
  service_level: 0.95
  risk:
    critical_coverage_weeks: 0.5
    warning_coverage_weeks: 1.0
    excess_coverage_weeks: 8.0
validation:
  window_weeks: 8
  minimum_history_weeks: 12
model_selection:
  selected_model: moving_average
  selection_metric: rmse
